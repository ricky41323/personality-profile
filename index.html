<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-in-One 성향 리포트 | Personality Profile</title>
  <meta name="description" content="에니어그램과 MBTI를 기반으로 성격 유형을 분석하고 대상자의 성향 프로필을 생성합니다.">
  
  <!-- Open Graph Meta Tags (Telegram, KakaoTalk, Facebook 등 링크 공유 썸네일용) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="All-in-One 성향 리포트">
  <meta property="og:description" content="에니어그램과 MBTI를 기반으로 한 맞춤형 성향 프로필을 확인해보세요!">
  <meta property="og:url" content="https://ricky41323.github.io/personality-profile/">
  <meta property="og:image" content="https://ricky41323.github.io/personality-profile/thumbnail.jpg"> <!-- 나중에 썸네일 이미지를 추가할 경우를 대비한 기본 경로 -->
  <meta property="og:site_name" content="Personality Profile">
  
  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="All-in-One 성향 리포트">
  <meta name="twitter:description" content="에니어그램과 MBTI를 기반으로 한 맞춤형 성향 프로필을 확인해보세요!">

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="index.css?v=14">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__icon">📊</div>
      <h1 class="app-header__title">All-in-One 성향 리포트</h1>
    </header>

    <!-- Input Section -->
    <section class="input-section" id="inputSection">
      <div class="input-section__title">
        <span>📝</span> 대상자 정보 입력
      </div>
      <form id="profileForm">
        <!-- Row 1: Basic Info (Name, MBTI, Enneagram) -->
        <div class="input-grid input-grid--3col">
          <div class="form-group">
            <label for="nameInput">대상자 이름</label>
            <input
              type="text"
              id="nameInput"
              placeholder="이름을 입력하세요"
              autocomplete="off"
              required
            >
          </div>
          <div class="form-group">
            <label for="mbtiInput">MBTI 유형</label>
            <input
              type="text"
              id="mbtiInput"
              placeholder="예: ISFJ, ENFP 등"
              autocomplete="off"
              required
            >
          </div>
          <div class="form-group">
            <label for="enneaInput">에니어그램 (상위 3유형)</label>
            <input
              type="text"
              id="enneaInput"
              placeholder="점수가 높은 애니어 순서대로 입력해주세요."
              autocomplete="off"
              required
            >
          </div>
        </div>

        <!-- Row 4: Core Emotions -->
        <div class="extended-group">
          <details class="extended-details">
            <summary class="extended-summary"><span>❤️</span> 핵심 감정 (선택사항)</summary>
            <div class="checkbox-grid checkbox-grid--core-emotions">
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="1"><span class="checkmark"></span> 부담감</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="2"><span class="checkmark"></span> 경쟁심</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="3"><span class="checkmark"></span> 억울함</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="4"><span class="checkmark"></span> 열등감</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="5"><span class="checkmark"></span> 외로움</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="6"><span class="checkmark"></span> 그리움</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="7"><span class="checkmark"></span> 질투</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="8"><span class="checkmark"></span> 두려움</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="9"><span class="checkmark"></span> 분노</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="10"><span class="checkmark"></span> 무기력</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="11"><span class="checkmark"></span> 허무</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="12"><span class="checkmark"></span> 슬픔</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="13"><span class="checkmark"></span> 불안</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="14"><span class="checkmark"></span> 공포</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="15"><span class="checkmark"></span> 소외</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreEmotions" value="16"><span class="checkmark"></span> 적개심</label>
            </div>
          </details>
        </div>

        <!-- Row 5: Core Beliefs -->
        <div class="extended-group">
          <details class="extended-details">
            <summary class="extended-summary"><span>🧠</span> 핵심 신념 (비합리적 신념) (선택사항)</summary>
            <div class="checkbox-grid checkbox-grid--core-beliefs">
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="1"><span class="checkmark"></span> 인정에 대한 욕구</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="2"><span class="checkmark"></span> 개인적 완벽성</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="3"><span class="checkmark"></span> 비난 경향성</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="4"><span class="checkmark"></span> 파국화</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="5"><span class="checkmark"></span> 정서적 무책임</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="6"><span class="checkmark"></span> 과잉 불안 염려</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="7"><span class="checkmark"></span> 문제 회피</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="8"><span class="checkmark"></span> 의존성</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="9"><span class="checkmark"></span> 무력감(무기력)</label>
              <label class="custom-checkbox"><input type="checkbox" name="coreBeliefs" value="10"><span class="checkmark"></span> 완벽한 해결</label>
            </div>
          </details>
        </div>

        <!-- Row 6: Defense Mechanisms -->
        <div class="extended-group">
          <details class="extended-details">
            <summary class="extended-summary"><span>🛡️</span> 방어기제 (선택사항)</summary>
            <div class="defense-groups">
              <div class="defense-group-box">
                <div class="defense-group-title defense-group-title--narcissistic">🔴 자아도취 단계</div>
                <div class="checkbox-grid checkbox-grid--1col">
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="1"><span class="checkmark"></span> 투사</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="2"><span class="checkmark"></span> 부정</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="3"><span class="checkmark"></span> 왜곡</label>
                </div>
              </div>
              <div class="defense-group-box">
                <div class="defense-group-title defense-group-title--immature">🟠 미성숙 단계</div>
                <div class="checkbox-grid checkbox-grid--2col">
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="4"><span class="checkmark"></span> 동일시</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="5"><span class="checkmark"></span> 수동공격</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="6"><span class="checkmark"></span> 신체화</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="7"><span class="checkmark"></span> 행동화</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="8"><span class="checkmark"></span> 퇴행</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="9"><span class="checkmark"></span> 회피</label>
                </div>
              </div>
              <div class="defense-group-box">
                <div class="defense-group-title defense-group-title--neurotic">🟡 신경증적 단계</div>
                <div class="checkbox-grid checkbox-grid--2col">
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="10"><span class="checkmark"></span> 허세</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="11"><span class="checkmark"></span> 반동형성</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="12"><span class="checkmark"></span> 전치</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="13"><span class="checkmark"></span> 통제</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="14"><span class="checkmark"></span> 합리화</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="15"><span class="checkmark"></span> 해리</label>
                </div>
              </div>
              <div class="defense-group-box">
                <div class="defense-group-title defense-group-title--mature">🟢 성숙 단계</div>
                <div class="checkbox-grid checkbox-grid--1col">
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="16"><span class="checkmark"></span> 억제</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="17"><span class="checkmark"></span> 예견</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="18"><span class="checkmark"></span> 승화</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="19"><span class="checkmark"></span> 이타주의</label>
                  <label class="custom-checkbox"><input type="checkbox" name="defenseMechanisms" value="20"><span class="checkmark"></span> 유머</label>
                </div>
              </div>
            </div>
          </details>
        </div>

        <!-- Validation message -->
        <div class="validation-msg" id="validationMsg"></div>

        <button type="submit" class="btn-analyze" id="analyzeBtn" disabled>
          <span>✨</span> 성향 분석 시작
        </button>
      </form>
    </section>

    <!-- Results Section -->
    <section class="results-section" id="resultsSection"></section>
  </div>

  <script src="data.js?v=12"></script>
  <script src="data-extended.js?v=12"></script>
  <script src="app.js?v=17"></script>
</body>
</html>
